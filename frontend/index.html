<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Server Hosting</title>
 <!-- connects the page to css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Minecraft Server Dashboard</h1>

  <p>
    Status:
    <span id="server-status">Unknown</span>
  </p>
  
  <p>
    Selected Server:
    <span id="selected-server">minecraft</span>
  </p>

  <h2>Create Server</h2>

  <div>
    <label for="server-name-input">Server Name:</label>
    <input id="server-name-input" type="text">

    <label for="server-type-input">Server Type:</label>
    <select id="server-type-input">
    <option value="VANILLA">Vanilla</option>
    <option value="PAPER">Paper</option>
    <option value="FABRIC">Fabric</option>
    <option value="FORGE">Forge</option>
    <option value="NEOFORGE">NeoForge</option>
    <option value="MODRINTH">Modrinth</option>
  </select>

  <label for="server-version-input">Minecraft Version:</label>
  <select id="server-version-input">
    <option value="1.21.1">1.21.1</option>
    <option value="1.20.1">1.20.1</option>
    <option value="1.19.2">1.19.2</option>
  </select>
  <div id="modpack-section" style="display: none;">
  <label for="modpack-input">Modrinth Modpack:</label>
  <input
    id="modpack-input"
    type="text"
    placeholder="Paste Modrinth URL or slug"
  >
</div>

    <button id="create-server-button">Create Server</button>
  </div>

  <p id="create-server-message"></p>

  <button id="check-status-button">Check Status</button>

  <div>
    <button id="start-button">Start</button>
    <button id="stop-button">Stop</button>
    <button id="restart-button">Restart</button>
    <button id="logs-button">View Logs</button>
  </div>

  <h2>Servers</h2>

  <div id="server-list">
    No servers loaded.
  </div>

  <h2>Server Logs</h2>

  <pre id="server-logs">No logs loaded.</pre>


  <p id="message"></p>

  <script src="app.js"></script>
</body>
</html>
